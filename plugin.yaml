name: hermes-observability-plugin
version: 0.1.0
description: Prospective, profile-local operational trace for Hermes Desktop.
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_approval_request
  - post_approval_response
