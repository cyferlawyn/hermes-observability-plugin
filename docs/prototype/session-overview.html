20px minmax(0,1fr) auto;gap:10px;text-align:left;background:transparent;border-bottom:1px solid var(--line2);padding:10px 12px;color:var(--text);align-items:start}.event-row:hover,.event-row.selected{background:#192433}.event-detail{padding:14px}.detail-block{margin-bottom:15px}.detail-block:last-child{margin-bottom:0}.detail-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.codebox{background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:10px;font:10px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d5e5}.detail-title{font-size:14px;font-weight:720;line-height:1.4}.stats-inline{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:10px}.stack{display:flex;align-items:center;gap:6px}.divider{height:1px;background:var(--line2);margin:10px 0}.failure-callout{background:linear-gradient(110deg,#27171c,#19141a);border:1px solid #56323a;border-radius:12px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:16px}.failure-callout .big{font-size:13px;font-weight:700}.failure-callout .sig{font-family:var(--mono);font-size:11px;color:#ffc1c4;margin-top:5px}.linkbutton{background:transparent;color:var(--blue);font-size:10px;padding:4px}.linkbutton:hover{text-decoration:underline}.board{display:grid;grid-template-columns:256px minmax(400px,1fr) 320px;gap:12px;align-items:start}.column{display:grid;gap:12px}.two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:12px;margin-top:12px}.session-list{max-height:510px;overflow:auto}.control-bottom{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;margin-top:12px}.triage-lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:12px;margin:13px 0}.signature-list{padding:5px 13px}.signature{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line2);align-items:center}.signature:last-child{border:0}.sig-icon{width:23px;height:23px;border-radius:7px;background:var(--red2);color:var(--red);display:grid;place-items:center;font-weight:800}.signature-name{font:10px/1.45 var(--mono);color:#f2c6c7}.signature-meta{font-size:9px;color:var(--muted);margin-top:4px}.triage-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px}.queue-item{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-bottom:1px solid var(--line2)}.queue-item:last-child{border-bottom:0}.queue-rank{font:10px var(--mono);color:var(--dim);padding-top:2px}.queue-item h3{font-size:11px;margin:0 0 4px}.queue-item p{font-size:10px;color:var(--muted);line-height:1.45;margin:0}.ledger-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line2)}.searchbox{background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);font-size:10px;min-width:190px}.ledger-grid{display:grid;grid-template-columns:230px minmax(420px,1fr) 320px;gap:10px;margin-top:12px}.ledger-table{width:100%;border-collapse:collapse}.ledger-table th{text-align:left;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.ledger-table td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:10px}.ledger-table tr{cursor:pointer}.ledger-table tbody tr:hover,.ledger-table tbody tr.selected{background:#192433}.ledger-name{font-weight:650}.ledger-sub{font:9px/1.45 var(--mono);color:var(--muted);margin-top:4px}.branch{margin:8px 0 4px 11px;border-left:1px solid #493c68;padding:4px 0 4px 10px;color:var(--purple);font-size:10px}.empty{padding:20px;text-align:center;color:var(--muted);font-size:11px}.switcher{position:fixed;z-index:10;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:1px <body>
<div id="app"></div><div id="toast" class="toast" role="status"></div>
<script>
const VARIANTS=[{key:'control',name:'Control room'},{key:'triage',name:'Failure queue'},{key:'ledger',name:'Trace ledger'}];
const windows={overall:{label:'Overall',calls:58,ok:50,failed:5,unknown:3,retries:7},today:{label:'Today',calls:27,ok:23,failed:3,unknown:1,retries:2},reset:{label:'Since Reset',calls:49,ok:42,failed:4,unknown:3,retries:5}};
const toolsByWindow={
 overall:[{name:'calendar.search_events',kind:'MCP',calls:8,ok:6,failed:1,unknown:1},{name:'drive.get_file',kind:'MCP',calls:14,ok:14,failed:0,unknown:0},{name:'web_search',kind:'Tool',calls:9,ok:7,failed:2,unknown:0},{name:'browser.open',kind:'Tool',calls:15,ok:11,failed:2,unknown:2},{name:'terminal',kind:'Tool',calls:12,ok:12,failed:0,unknown:0}],
 today:[{name:'calendar.search_events',kind:'MCP',calls:4,ok:2,failed:1,unknown:1},{name:'drive.get_file',kind:'MCP',calls:6,ok:6,failed:0,unknown:0},{name:'web_search',kind:'Tool',calls:4,ok:3,failed:1,unknown:0},{name:'browser.open',kind:'Tool',calls:5,ok:4,failed:1,unknown:0},{name:'terminal',kind:'Tool',calls:8,ok:8,failed:0,unknown:0}],
 reset:[{name:'calendar.search_events',kind:'MCP',calls:6,ok:4,failed:1,unknown:1},{name:'drive.get_file',kind:'MCP',calls:10,ok:10,failed:0,unknown:0},{name:'web_search',kind:'Tool',calls:9,ok:7,failed:2,unknown:0},{name:'browser.open',kind:'Tool',calls:12,ok:9,failed:1,unknown:2},{name:'terminal',kind:'Tool',calls:12,ok:12,failed:0,unknown:0}]
};
const sessions=[
 {id:'SYN-1042',title:'Investigate calendar & search failures',time:'Today · 14:12',state:'Interrupted',calls:9,ok:6,failed:2,unknown:1,rate:'75.0%',model:'Claude Sonnet · synthetic',duration:'6m 18s',children:2},
 {id:'SYN-1041',title:'Review remote gateway MCP setup',time:'Today · 11:06',state:'Complete',calls:12,ok:11,failed:1,unknown:0,rate:'91.7%',model:'GPT-5 · synthetic',duration:'9m 02s',children:1},
 {id:'SYN-1038',title:'Summarize connector documentation',time:'Today · 09:34',state:'Complete',calls:6,ok:6,failed:0,unknown:0,rate:'100%',model:'Claude Sonnet · synthetic',duration:'3m 41s',children:0},
 {id:'SYN-1026',title:'Search docs: required query argument',time:'Yesterday · 16:51',state:'Complete',calls:9,ok:8,failed:1,unknown:0,rate:'88.9%',model:'GPT-5 · synthetic',duration:'5m 09s',children:1},
 {id:'SYN-1019',title:'Inspect browser connector retries',time:'Yesterday · 14:23',state:'Complete',calls:13,ok:11,failed:0,unknown:2,rate:'100%',model:'Claude Sonnet · synthetic',duration:'8m 26s',children:2}
];
const events=[
 {id:'e1',time:'14:12:04',type:'User turn',title:'“Why are the calendar searches failing?”',desc:'Visible message · session SYN-1042',status:'neutral'},
 {id:'e2',time:'14:12:07',type:'Provider attempt',title:'API request completed',desc:'Claude Sonnet · 2.1 s · 1 attempt · payload hidden',status:'ok'},
 {id:'e3',time:'14:13:19',type:'web_search',title:'Search docs without required query',desc:'Tool · explicit argument error · repeated signature in another session',status:'fail',args:'{"limit":5}',result:'error: missing required argument `query`'},
 {id:'e4',time:'14:14:02',type:'delegate_task',title:'Inspect MCP schema docs',desc:'Subagent · completed · 2m 44s · 4 calls',status:'sub',args:'Goal: confirm required date-window arguments',result:'The schema requires both timeMin and timeMax.'},
 {id:'e5',time:'14:15:31',type:'calendar.search_events',title:'Search events for date range',desc:'MCP · 38 ms · explicit argument error',status:'fail',args:'{"timeMin":"2026-10-13T00:00:00+02:00","calendarId":"primary"}',result:'error: missing required argument `timeMax`'},
 {id:'e6',time:'14:16:10',type:'Assistant turn',title:'“The call omitted timeMax; I’m correcting the request.”',desc:'Visible assistant response · no provider reasoning shown',status:'neutral'},
 {id:'e7',time:'14:17:02',type:'delegate_task',title:'Compare repeated error examples',desc:'Subagent · interrupted · 1m 06s · child trace has a gap',status:'sub'},
 {id:'e8',time:'14:18:22',type:'calendar.search_events',title:'Retry date-window search',desc:'MCP · started, no completion event captured',status:'unknown',args:'{"timeMin":"2026-10-13T00:00:00+02:00","timeMax":"2026-10-14T00:00:00+02:00"}',result:'No terminal status recorded. Outcome remains unknown; excluded from success-rate denominator.'}
];
let state={variant:new URLSearchParams(location.search).get('variant')||'control',window:'overall',session:'SYN-1042',event:'e5',toastTimer:null};
function fmtRate(m){const known=m.ok+m.failed;return known?((m.ok/known)*100).toFixed(1)+'%':'—'}
function pill(status,label){const cls=status==='ok'?'ok':status==='fail'?'fail':status==='unknown'?'unknown':status==='sub'?'child':'neutral';return `<span class="pill ${cls}"><i class="dot"></i>${label||({ok:'OK',fail:'Failed',unknown:'Unknown',sub:'Subagent',neutral:'Event'}[status])}</span>`}
function header(){const w=windows[state.window];return `<div class="topbar"><div class="brand"><div class="brandmark">H</div><div><div class="brandname">HERMES <span class="hairline">/</span> OBSERVABILITY</div><div class="brandhint">Session diagnostics <span class="hairline">·</span> connected personal profile</div></div></div><div class="top-actions"><span class="profile">Profile: personal · remote gateway</span><span class="demo">SYNTHETIC DEMO DATA</span></div></div><div class="page-title"><div><div class="eyebrow">Observer trace prototype</div><h1>Session observability</h1><p>Find the failing call, inspect its context, then follow the evidence to similar sessions.</p></div><div class="window-tools"><div class="filter" role="group" aria-label="Metrics window">${[['overall','Overall'],['today','Today'],['reset','Since Reset']].map(([k,v])=>`<button data-window="${k}" class="${state.window===k?'active':''}">${v}</button>`).join('')}</div><button class="reset-button" data-action="reset">Reset metrics</button></div></div>`}
function metricStrip(){const m=windows[state.window];const rate=fmtRate(m);return `<div class="metrics"><div class="metric"><div class="metric-label">Call success</div><div class="metric-value good">${rate}</div><div class="metric-sub">${m.ok} ok / ${m.ok+m.failed} known executed</div></div><div class="metric"><div class="metric-label">Invocations</div><div class="metric-value">${m.calls}</div><div class="metric-sub">Tool + MCP calls</div></div><div class="metric"><div class="metric-label">Explicit failures</div><div class="metric-value bad">${m.failed}</div><div class="metric-sub">Observable failure indicators</div></div><div class="metric"><div class="metric-label">Unknown / incomplete</div><div class="metric-value warn">${m.unknown}</div><div class="metric-sub">Visible, excluded from rate</div></div><div class="metric"><div class="metric-label">Provider retries</div><div class="metric-value info">${m.retries}</div><div class="metric-sub">Separate from tool calls</div></div></div>`}
function sessionRows(){return sessions.map(s=>`<button class="session-row ${state.session===s.id?'selected':''}" data-session="${s.id}"><span><span class="session-name">${s.title}</span><span class="session-time">${s.time} <span class="hairline">·</span> ${s.state}</span><span class="session-tag">${s.id} <span class="hairline">·</span> ${s.children} subagent${s.children===1?'':'s'}</span></span><span><span class="rate ${s.failed?'mid':'good'}">${s.rate}</span><br><span class="session-count">${s.calls} calls</span></span></button>`).join('')}
function selectedSession(){return sessions.find(s=>s.id===state.session)||sessions[0]}
function selectedEvent(){return events.find(e=>e.id===state.event)||events[4]}
function toolPanel(){const rows=toolsByWindow[state.window]||[];return `<section class="panel"><div class="panel-head"><span class="panel-title">Tool &amp; MCP breakdown</span><span class="subtle">${windows[state.window].label}</span></div><div class="tool-list">${rows.map(t=>{const known=t.ok+t.failed;const pct=known?Math.round(t.ok/known*100):0;const rate=known?`${pct}%`:'—';return `<div class="tool-line"><div><div class="tool-name">${t.name}</div><div class="tiny">${t.calls} calls · ${t.failed} failed · ${t.unknown} unknown</div><div class="bar"><span style="width:${pct}%" class="${t.failed||t.unknown?'warnbar':''}"></span></div></div><span class="rate ${t.failed||t.unknown?'mid':'good'}">${rate}</span></div>`}).join('')}</div><div class="muted-note">Success rate uses known executed outcomes only. Unknowns remain visible and are not counted as successes.</div></section>`}
function eventTrace(){return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Chronological trace</div><div class="subtle" style="margin-top:4px">${selectedSession().id} <span class="hairline">·</span> newest events at bottom</div></div><span class="pill unknown">Capture gap visible</span></div><div class="trace">${events.map(e=>`<button class="event-row ${state.event===e.id?'selected':''}" data-event="${e.id}"><span class="trace-time">${e.time}</span><span class="trace-mark ${e.status==='fail'?'err':e.status==='unknown'?'unk':e.status==='sub'?'sub':''}"></span><span class="trace-content"><span class="trace-title">${e.title} ${pill(e.status,e.type)}</span><span class="trace-desc">${e.desc}</span></span><span class="tiny">›</span></button>`).join('')}</div><div class="muted-note">Operational trace only: visible turns and lifecycle metadata. Provider reasoning and raw API payloads are not displayed.</div></section>`}
function inspector(){const e=selectedEvent();return `<section class="panel"><div class="panel-head"><span class="panel-title">Event inspector</span><span class="mono muted">${e.time}</span></div><div class="event-detail"><div class="detail-block"><div class="detail-label">Selected event</div><div class="detail-title">${e.type}</div><div class="stats-inline">${pill(e.status)} <span>${e.desc}</span></div></div><div class="detail-block"><div class="detail-label">Arguments</div><div class="codebox">${e.args||'No tool arguments on this event.'}</div></div><div class="detail-block"><div class="detail-label">Result / status evidence</div><div class="codebox">${e.result||'No result payload on this event.'}</div></div><div class="divider"></div><div class="detail-block"><div class="detail-label">Correlation</div><div class="codebox">session_id: ${selectedSession().id}\nturn_id: turn-demo-17\ntool_call_id: call-demo-${e.id}\nsource: synthetic</div></div></div></section>`}
function sessionPanel(){return `<section class="panel"><div class="panel-head"><span class="panel-title">Recent captured sessions</span><span class="subtle">${sessions.length} shown</span></div><div class="session-list">${sessionRows()}</div><div class="muted-note">Prospective capture only. Sessions already open when collection starts are excluded.</div></section>`}
function subagentPanel(){return `<section class="panel"><div class="panel-head"><span class="panel-title">Subagent activity</span><span class="subtle">${selectedSession().children} children</span></div><div class="event-detail"><div class="stack">${pill('sub','schema-check')}<span class="tiny">completed · 2m 44s · 4 calls</span></div><div class="branch">↳ docs lookup <span class="hairline">·</span> completed</div><div class="divider"></div><div class="stack">${pill('unknown','error-cluster')}<span class="tiny">interrupted · 1m 06s · partial trace</span></div><div class="branch">↳ no terminal event captured; not counted as success or failure</div></div></section>`}
function control(){return `<div class="board"><div class="column">${sessionPanel()}${toolPanel()}</div><div class="column"><section class="panel"><div class="panel-head"><div><span class="panel-title">${selectedSession().title}</span><div class="subtle" style="margin-top:4px">${selectedSession().id} <span class="hairline">·</span> ${selectedSession().model} <span class="hairline">·</span> ${selectedSession().duration}</div></div>${pill(selectedSession().state==='Interrupted'?'unknown':'ok',selectedSession().state)}</div><div style="padding:13px 14px"><div class="section-label">Selected session · ${selectedSession().calls} calls · ${selectedSession().rate} known-call success</div></div>${eventTrace()}</section></div><div class="column detail-column">${inspector()}${subagentPanel()}</div></div>`}
function failureQueue(){return `<div class="failure-callout"><div><div class="eyebrow" style="color:var(--red);margin-bottom:4px">Repeated deterministic error</div><div class="big">Required argument <code class="mono">query</code> missing</div><div class="sig">web_search · 2 calls across 2 sessions · same observable signature</div></div><button class="iconbutton" data-session="SYN-1026">Open example session ↗</button></div><div class="triage-lead"><section class="panel"><div class="panel-head"><span class="panel-title">Failure signatures</span><span class="subtle">Evidence-first · no LLM diagnosis</span></div><div class="signature-list"><div class="signature"><div class="sig-icon">!</div><div><div class="signature-name">missing required argument: query</div><div class="signature-meta">2 failures · web_search · 2 sessions · last seen yesterday 16:52</div></div><button class="linkbutton" data-session="SYN-1026">Inspect</button></div><div class="signature"><div class="sig-icon">!</div><div><div class="signature-name">request deadline exceeded</div><div class="signature-meta">2 failures · browser.open · 2 sessions · last seen today 11:19</div></div><button class="linkbutton" data-session="SYN-1019">Inspect</button></div><div class="signature"><div class="sig-icon" style="background:var(--amber2);color:var(--amber)">?</div><div><div class="signature-name">completion status not recorded</div><div class="signature-meta">3 unknown outcomes · excluded from success rates</div></div><button class="linkbutton" data-event="e8">Inspect</button></div></div></section>${toolPanel()}</div><div class="triage-grid"><section class="panel"><div class="panel-head"><span class="panel-title">Sessions to inspect</span><span class="subtle">failure / unknown first</span></div><div>${sessions.filter(s=>s.failed||s.unknown).map((s,i)=>`<div class="queue-item"><span class="queue-rank">0${i+1}</span><div><h3>${s.title}</h3><p>${s.id} <span class="hairline">·</span> ${s.failed} failed <span class="hairline">·</span> ${s.unknown} unknown</p><button class="linkbutton" data-session="${s.id}">Open session trace →</button></div></div>`).join('')}</div></section><div class="column"><section class="panel"><div class="panel-head"><span class="panel-title">Selected example · ${selectedSession().id}</span>${pill('fail','Failure')}</div><div style="padding:14px"><div class="detail-title">${selectedSession().title}</div><div class="stats-inline"><span>${selectedSession().calls} calls</span><span>${selectedSession().rate} success</span><span>${selectedSession().duration}</span></div><div class="divider"></div>${events.filter(e=>e.status==='fail'||e.status==='unknown').map(e=>`<button class="event-row ${state.event===e.id?'selected':''}" data-event="${e.id}"><span class="trace-time">${e.time}</span>${pill(e.status)}<span class="trace-content"><span class="trace-title">${e.title}</span><span class="trace-desc">${e.desc}</span></span><span>›</span></button>`).join('')}<button class="linkbutton" data-variant="ledger">Open complete chronological trace →</button></div></section>${inspector()}</div></div>`}
function ledger(){return `<div class="panel"><div class="ledger-toolbar"><div class="stack"><strong class="panel-title">Trace ledger</strong><span class="pill neutral">${selectedSession().id}</span><span class="subtle">${selectedSession().title}</span></div><input class="searchbox" id="eventSearch" placeholder="Filter events by name or status…" aria-label="Filter events"></div><div class="ledger-grid"><div class="column">${sessionPanel()}${subagentPanel()}</div><section class="panel" style="border-radius:10px"><div class="panel-head"><span class="panel-title">Event sequence</span><span class="subtle">${selectedSession().duration} session <span class="hairline">·</span> ${selectedSession().calls} calls</span></div><div class="table-scroll"><table class="ledger-table"><thead><tr><th>Time</th><th>Event</th><th>Status</th><th>Duration / context</th></tr></thead><tbody id="ledgerRows">${events.map(e=>`<tr class="${state.event===e.id?'selected':''}" data-event="${e.id}"><td class="mono muted">${e.time}</td><td><div class="ledger-name">${e.title}</div><div class="ledger-sub">${e.type}</div></td><td>${pill(e.status)}</td><td class="muted">${e.desc}</td></tr>`).join('')}</tbody></table></div><div class="muted-note">Unknown means no terminal outcome was observed. No success/failure inference is made.</div></section><div class="inspector column">${inspector()}${toolPanel()}</div></div></div>`}
function switcher(){const index=Math.max(0,VARIANTS.findIndex(v=>v.key===state.variant));const v=VARIANTS[index];return `<nav class="switcher" aria-label="Prototype variants"><button data-cycle="-1" aria-label="Previous variant">‹</button><span class="switch-label">${v.key.toUpperCase()} · ${v.name}<small>Prototype layout switcher</small></span><button data-cycle="1" aria-label="Next variant">›</button></nav>`}
function render(){if(!VARIANTS.some(v=>v.key===state.variant))state.variant='control';const view=state.variant==='triage'?failureQueue():state.variant==='ledger'?ledger():control();document.getElementById('app').innerHTML=`<main class="page">${header()}${metricStrip()}${view}<div class="muted-note" style="border:0;text-align:center;margin:14px auto;max-width:840px">Prototype only · all names, sessions, counts, arguments, results, and error signatures above are synthetic. No production data or live actions.</div></main>${switcher()}`;bind()}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
function setVariant(key){state.variant=key;const url=new URL(location.href);url.searchParams.set('variant',key);try{history.replaceState(null,'',url.pathname+url.search+url.hash)}catch(_e){}render()}
function bind(){document.querySelectorAll('[data-window]').forEach(b=>b.addEventListener('click',()=>{state.window=b.dataset.window;render()}));document.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('click',()=>{state.session=b.dataset.session;state.event=state.session==='SYN-1026'?'e3':'e5';render()}));document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>{state.event=b.dataset.event;render()}));document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>setVariant(b.dataset.variant)));document.querySelectorAll('[data-cycle]').forEach(b=>b.addEventListener('click',()=>{let i=VARIANTS.findIndex(v=>v.key===state.variant);i=(i+Number(b.dataset.cycle)+VARIANTS.length)%VARIANTS.length;setVariant(VARIANTS[i].key)}));document.querySelectorAll('[data-action="reset"]').forEach(b=>b.addEventListener('click',()=>{windows.reset={label:'Since Reset',calls:0,ok:0,failed:0,unknown:0,retries:0};toolsByWindow.reset=toolsByWindow.reset.map(t=>({...t,calls:0,ok:0,failed:0,unknown:0}));state.window='reset';render();toast('Prototype only: cutoff advanced. No session or trace data was deleted.')}));const search=document.getElementById('eventSearch');if(search)search.addEventListener('input',()=>{const q=search.value.toLowerCase();document.querySelectorAll('#ledgerRows tr').forEach(row=>row.style.display=row.innerText.toLowerCase().includes(q)?'':'none')})}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();let i=VARIANTS.findIndex(v=>v.key===state.variant);i=(i+(e.key==='ArrowRight'?1:-1)+VARIANTS.length)%VARIANTS.length;setVariant(VARIANTS[i].key)}});
render();
</script>
</body>
</html>
